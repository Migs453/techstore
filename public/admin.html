<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Administração de Usuários</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1> TechStore | Painel Admin</h1>
    <nav>
      <a href="boas_vindas.html">Home Store</a>
      <a href="#" onclick="fazerLogout()">Sair</a>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <h2>Gestão de Usuários Cadastrados</h2>

      <div class="search-bar">
        <input type="text" id="searchCpf" placeholder="Buscar usuário por CPF...">
        <button type="button" onclick="buscarPorCpf()">Buscar</button>
        <button type="button" class="btn-warning" onclick="carregarUsuarios()">Limpar</button>
      </div>

      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Nome Completo</th>
              <th>CPF</th>
              <th>Email</th>
              <th>Cidade/UF</th>
              <th>Telefone</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaUsuarios">
            <!-- Renderizado dinamicamente via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Form de Edição -->
    <div class="card" id="editCard" style="display: none;">
      <h2>Editar Dados do Usuário</h2>
      <form id="editForm">
        <input type="hidden" id="editId">
        <div class="form-grid">
          <div class="form-group">
            <label for="editNome">Nome</label>
            <input type="text" id="editNome" required>
          </div>
          <div class="form-group">
            <label for="editSobrenome">Sobrenome</label>
            <input type="text" id="editSobrenome" required>
          </div>
          <div class="form-group">
            <label for="editCpf">CPF</label>
            <input type="text" id="editCpf" required>
          </div>
          <div class="form-group">
            <label for="editTelefone">Telefone</label>
            <input type="text" id="editTelefone" required>
          </div>
          <div class="form-group">
            <label for="editEmail">Email</label>
            <input type="email" id="editEmail" required>
          </div>
          <div class="form-group">
            <label for="editSenha">Senha</label>
            <input type="password" id="editSenha" required>
          </div>
          <div class="form-group">
            <label for="editCep">CEP</label>
            <input type="text" id="editCep" required>
          </div>
          <div class="form-group">
            <label for="editRua">Rua</label>
            <input type="text" id="editRua" required>
          </div>
          <div class="form-group">
            <label for="editCidade">Cidade</label>
            <input type="text" id="editCidade" required>
          </div>
          <div class="form-group">
            <label for="editEstado">Estado</label>
            <input type="text" id="editEstado" required maxlength="2">
          </div>
        </div>
        <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
          <button type="submit">Salvar Alterações</button>
          <button type="button" class="btn-danger" onclick="fecharEdicao()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      verificarAcessoAdmin();
      carregarUsuarios();
    });
  </script>
</body>
</html>
