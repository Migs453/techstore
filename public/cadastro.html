<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1> TechStore</h1>
  </header>

  <div class="container">
    <div class="card">
      <h2>Criar Nova Conta</h2>
      <form id="cadastroForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" required placeholder="Ex: João">
          </div>
          <div class="form-group">
            <label for="sobrenome">Sobrenome *</label>
            <input type="text" id="sobrenome" required placeholder="Ex: Silva">
          </div>
          <div class="form-group">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" required placeholder="000.000.000-00">
          </div>
          <div class="form-group">
            <label for="telefone">Telefone *</label>
            <input type="text" id="telefone" required placeholder="(00) 00000-0000">
          </div>
          <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" required placeholder="email@exemplo.com">
          </div>
          <div class="form-group">
            <label for="senha">Senha *</label>
            <input type="password" id="senha" required placeholder="••••••••">
          </div>
          <div class="form-group">
            <label for="cep">CEP *</label>
            <input type="text" id="cep" required placeholder="00000-000">
          </div>
          <div class="form-group">
            <label for="rua">Rua *</label>
            <input type="text" id="rua" required placeholder="Nome da rua e número">
          </div>
          <div class="form-group">
            <label for="cidade">Cidade *</label>
            <input type="text" id="cidade" required placeholder="Sua cidade">
          </div>
          <div class="form-group">
            <label for="estado">Estado *</label>
            <input type="text" id="estado" required maxlength="2" placeholder="UF">
          </div>
        </div>
        <button type="submit" style="margin-top: 1.5rem; width: 100%;">Finalizar Cadastro</button>
      </form>
      <a href="index.html" class="link-redirect">Já possui uma conta? Voltar ao Login</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
